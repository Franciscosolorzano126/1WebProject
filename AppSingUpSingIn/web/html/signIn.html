<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUpSignIn - Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="container">
        <!-- Cabecera -->
        <div class="header">
            <h1>USER LOGIN</h1>
            <p>Welcome back! Please enter your details.</p>
        </div>

        <!-- Formulario -->
        <section class="login-shell">
            <form class="login-card login-form-card" action="#" method="post">
                
                <!-- Correo Electrónico con Icono -->
                <label class="input-row">
                    <span class="icon">👤</span>
                    <input type="email" name="email" placeholder="Email ID" autocomplete="email" required>
                </label>

                <!-- Contraseña con Icono -->
                <label class="input-row">
                    <span class="icon">🔒</span>
                    <div class="password-container">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Password"
                                autocomplete="new-password"
                                required
                                >
                            <span class="eye" aria-hidden="true">👁</span>
                        </div>
                </label>

                <!-- Botones -->
                <div class="buttons full-width">
                    <button type="submit" class="btn btn-primary">
                        LOGIN
                    </button>
                    <a class="btn btn-secondary" href="signUp.html">
                        REGISTER
                    </a>
                </div>
                
            </form>
        </section>
    </main>
</body>
</html>
