
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUpSignIn - Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="container">

        <!-- Cabecera -->
        <div class="header">
            <h1>USER LOGIN</h1>
            <p>Welcome back! Please enter your details.</p>
        </div>

        <!-- Formulario -->
        <section class="login-shell">
            <form id="loginForm" class="login-card login-form-card" action="#" method="post">

                <!-- Correo Electrónico -->
                <label class="input-row">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email ID"
                        autocomplete="email"
                        required
                    >
                </label>

                <!-- Contraseña -->
                <label class="input-row">
                    <div class="password-container">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            required
                        >

                        <span id="passwordToggle" class="eye">👁</span>
                    </div>
                </label>

                <div id="successMessage" style="display: none;"></div>

                <!-- Botones -->
                <div class="buttons full-width">
                    <button type="submit" class="btn btn-primary login-btn">
                        LOGIN
                    </button>

                    <a class="btn btn-secondary" href="signUp.html">
                        REGISTER
                    </a>
                </div>

            </form>
        </section>
    </main>

    <script type="module" src="../js/signIn.js"></script>
</body>
</html>
