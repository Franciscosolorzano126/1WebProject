
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SignUpSignIn - Login</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Font Awesome para el icono del ojo -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <main class="container">

        <!-- CABECERA -->
        <div class="header">
            <h1>USER LOGIN</h1>
            <p>Welcome back! Please enter your details.</p>
        </div>

        <!-- FORMULARIO -->
        <section class="login-shell">

            <form id="loginForm"
                  class="login-card login-form-card"
                  action="#"
                  method="post">

                <!-- EMAIL -->
                <div class="field-wrapper">

                    <label class="input-row" for="email">

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Email ID"
                            autocomplete="email"
                            required
                        >

                    </label>

                    <div id="emailError"
                         class="error-message"
                         style="display: none;">
                    </div>

                </div>

                <!-- PASSWORD -->
                <div class="field-wrapper">

                    <div class="input-row">

                        <div class="password-container">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                id="passwordToggle"
                                class="eye"
                                aria-label="Mostrar contraseña"
                                title="Mostrar contraseña"
                                aria-pressed="false"
                            >

                                <i class="fa-solid fa-eye"></i>

                            </button>

                        </div>

                    </div>

                    <div id="passwordError"
                         class="error-message"
                         style="display: none;">
                    </div>

                </div>

                <!-- MENSAJE DE ÉXITO -->
                <div id="successMessage"
                     class="error-message success-message"
                     style="display: none;">
                </div>

                <!-- BOTONES -->
                <div class="buttons full-width">

                    <button type="submit"
                            class="btn btn-primary login-btn">
                        LOGIN
                    </button>

                    <a class="btn btn-secondary"
                       href="signUp.html">
                        REGISTER
                    </a>

                </div>

            </form>

        </section>

    </main>

    <!-- JAVASCRIPT -->
    <script type="module" src="../js/signIn.js"></script>

</body>
</html>
