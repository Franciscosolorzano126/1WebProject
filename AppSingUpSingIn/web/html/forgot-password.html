<!DOCTYPE html>
<html lang="es">
<head>

  <title>SignUpSignIn - Forgot Password</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="page">
    <section class="login-shell">
      <h1>RESET PASSWORD</h1>

      <a class="btn register-btn" href="index.html">BACK TO LOGIN</a>
    </section>
  </main>
