<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SignUpSignIn - Register</title>
        <link rel="stylesheet" href="/AppSignUpSignIn/css/style.css">
    </head>
    <body>
        <main class="container">
            <!-- Cabecera -->
            <div class="header">
                <h1>USER REGISTER</h1>
                <p>Please fill in your details to create an account</p>
            </div>

            <!-- Formulario -->
            <section class="login-shell">
                <form class="login-card register-card" action="#" method="post">

                    <!-- NOMBRE -->
                    <label class="field">
                        <span>First Name</span>
                        <input type="text" 
                               id="firstName" 
                               name="firstName" 
                               placeholder="First name" 
                               autocomplete="given-name" 
                               required
                               >
                        <!-- Aquí aparecerá el mensaje de validación -->
                        <small class="error-message" id="firstNameError"></small>
                    </label>

                    <!-- APELLIDOS -->
                    <label class="field">
                        <span>Last Name</span>
                        <input type="text" id="lastName" name="lastName" placeholder="Last name" autocomplete="family-name" required>
                        <small class="error-message" id="lastNameError"></small>
                    </label>

                    <!-- INICIAL DEL SEGUNDO NOMBRE -->
                    <label class="field">
                        <span>Middle Initial</span>
                        <input type="text" id="middleInitial" name="middleInitial" placeholder="Middle initial" maxlength="1">

                        <!-- Espacio para mostrar posibles errores de validación. -->
                        <small class="error-message" id="middleInitialError"></small>
                    </label>

                    <!-- TELÉFONO Y PREFIJO -->
                    <label class="field">
                        <span>Phone</span>
                        <div class="phone-group">
                            <select name="prefix" id="prefix" aria-label="International phone prefix" required>
                                <option value="+34" selected>🇪🇸 +34</option>
                                <option value="+1">🇺🇸 +1</option>
                                <option value="+44">🇬🇧 +44</option>
                                <option value="+33">🇫🇷 +33</option>
                                <option value="+49">🇩🇪 +49</option>
                                <option value="+39">🇮🇹 +39</option>
                                <option value="+351">🇵🇹 +351</option>
                                <option value="+52">🇲🇽 +52</option>
                                <option value="+57">🇨🇴 +57</option>
                                <option value="+54">🇦🇷 +54</option>
                                <option value="+51">🇵🇪 +51</option>
                                <option value="+56">🇨🇱 +56</option>
                                <option value="+593">🇪🇨 +593</option>
                                <option value="+591">🇧🇴 +591</option>
                                <option value="+58">🇻🇪 +58</option>
                            </select>
                            <input type="tel" id="phone" name="phone" placeholder="Phone number" autocomplete="tel-national" required>
                        </div>
                        <!-- Mensaje de error para la validación del teléfono. -->
                        <small class="error-message" id="phoneError"></small>
                    </label>

                    <!-- CALLE (Ocupa 2 columnas) -->
                    <label class="field full-width">
                        <span>Street</span>
                        <input type="text" id="street" name="street" placeholder="Street and number" autocomplete="street-address" required>

                        <!-- Espacio donde mostraremos el mensaje de error de la dirección. -->
                        <small class="error-message" id="streetError"></small>
                    </label>

                    <!-- CIUDAD -->
                    <label class="field">
                        <span>City</span>
                        <input type="text" id="city" name="city" placeholder="City" autocomplete="address-level2" required>

                        <!-- Espacio donde mostraremos el mensaje de error de la ciudad. -->
                        <small class="error-message" id="cityError"></small>
                    </label>

                    <!-- PROVINCIA O ESTADO -->
                    <label class="field">
                        <span>State</span>
                        <input type="text" id="state" name="state" placeholder="State or province" autocomplete="address-level1" required>

                        <!-- Espacio donde mostraremos el mensaje de error de la provinciaD. -->
                        <small class="error-message" id="stateError"></small>
                    </label>

                    <!-- CÓDIGO POSTAL -->
                    <label class="field">
                        <span>ZIP</span>
                        <input type="text" id="zip" name="zip" placeholder="Postal code" autocomplete="postal-code" inputmode="numeric" required>

                        <!-- Espacio donde mostraremos el mensaje de error del código postal. -->
                        <small class="error-message" id="zipError"></small>
                    </label>

                    <!-- CORREO ELECTRÓNICO -->
                    <label class="field">
                        <span>Email</span>
                        <input type="email" id="email" name="email" placeholder="example@example.com" autocomplete="email">

                        <!-- Espacio donde mostraremos el mensaje de error del correo electrónico. -->
                        <small class="error-message" id="emailError"></small>
                    </label>


                    <!-- CONTRASEÑA -->
                    <label class="field full-width">
                        <span>Password</span>
                        <div class="password-container">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                required
                                >
                            <span class="eye" aria-hidden="true">👁</span>
                        </div>

                        <!-- Mensaje de error para la validación de la contraseña. -->
                        <small class="error-message" id="passwordError"></small>
                    </label>

                    <!-- REPETIR CONTRASEÑA -->
                    <label class="field full-width">
                        <span>Repeat Password</span>
                        <div class="password-container">
                            <input
                                type="password"
                                id="repeatPassword"
                                name="repeatPassword"
                                placeholder="Repeat your password"
                                autocomplete="new-password"
                                required
                                >
                            <span class="eye" aria-hidden="true">👁</span>
                        </div>

                        <!-- Mensaje de error para comprobar que ambas contraseñas coincidan. -->
                        <small class="error-message" id="repeatPasswordError"></small>
                    </label>

                    <!-- BOTONES (Ocupan 2 columnas) -->
                    <div class="buttons full-width">
                        <button type="submit" class="btn btn-primary">
                            CREATE ACCOUNT
                        </button>
                        <a class="btn btn-secondary" href="/AppSignUpSignIn/html/signIn.html">
                            BACK TO LOGIN
                        </a>
                    </div>
                </form>
            </section>
        </main>

        <!-- Conectamos el archivo JavaScript del registro -->
        <script type="module" src="../js/signUp.js"></script>

    </body>
</html>
